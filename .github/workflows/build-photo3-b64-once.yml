name: Build photo 3 Base64 asset once

on:
  push:
    paths:
      - .github/workflows/build-photo3-b64-once.yml

permissions:
  contents: write

jobs:
  build-photo3-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the same Base64 asset format as image 2
        shell: bash
        run: |
          base64 -w 0 assets/prevention-photo3-original.webp > assets/generic-prevention-hero.webp.b64
          test "$(head -c 4 assets/generic-prevention-hero.webp.b64)" = "UklG"
          rm .github/workflows/build-photo3-b64-once.yml

      - name: Commit only the Base64 asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generic-prevention-hero.webp.b64 .github/workflows/build-photo3-b64-once.yml
          git diff --cached --check
          git commit -m "Add photo 3 in the same Base64 format as image 2"
          git push
