name: Public site CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock-only --ignore-scripts && npm ci --ignore-scripts
      - name: Verify controlled integration
        run: npm run verify
      - name: Serve static site
        run: |
          python3 -m http.server 4173 >/tmp/cabinet-public.log 2>&1 &
          echo $! >/tmp/cabinet-public.pid
      - name: Smoke test public pages and assets
        run: |
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/rendez-vous.html | grep -q 'Transmettre la demande'
          curl -fsS http://127.0.0.1:4173/backend-config.js | grep -q 'CABINET_LUCIA_BACKEND'
          curl -fsS http://127.0.0.1:4173/public-api.js | grep -q '/api/public/appointment-requests'
      - name: Browser availability diagnostics
        run: |
          which google-chrome-stable || true
          which google-chrome || true
          which chromium || true
          which chromium-browser || true
          google-chrome-stable --version || true
          google-chrome --version || true
          chromium --version || true
          chromium-browser --version || true
      - name: Browser technical recipe
        shell: bash
        run: |
          set +e
          TECHNICAL_RECIPE_REPORT=public-technical-recipe.json npm run test:browser >public-browser-recipe.log 2>&1
          status=$?
          cat public-browser-recipe.log
          if [ -f public-technical-recipe.json ]; then cat public-technical-recipe.json; fi
          exit $status
      - name: Scroll performance recipe
        shell: bash
        run: |
          SCROLL_PERF_REPORT=scroll-performance.json npm run test:scroll >scroll-performance.log 2>&1
          cat scroll-performance.log
          cat scroll-performance.json
      - name: Upload public recipe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-technical-recipe
          path: |
            public-technical-recipe.json
            public-browser-recipe.log
            scroll-performance.json
            scroll-performance.log
          if-no-files-found: warn
      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/cabinet-public.pid)" 2>/dev/null || true
