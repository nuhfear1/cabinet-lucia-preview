name: Install photo 3 from verified parts

on:
  push:
    paths:
      - '.photo3-upload/READY'

permissions:
  contents: write

jobs:
  install-photo3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify photo 3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil

          root = Path('.')
          upload = root / '.photo3-upload'
          parts = sorted(upload.glob('part*.txt'))
          if len(parts) != 10:
              raise SystemExit(f'Expected 10 parts, found {len(parts)}')

          payload = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          if len(payload) != 299688:
              raise SystemExit(f'Unexpected Base64 length: {len(payload)}')

          jpeg = base64.b64decode(payload, validate=True)
          if len(jpeg) != 224764:
              raise SystemExit(f'Unexpected JPEG length: {len(jpeg)}')
          if not jpeg.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Invalid JPEG header')
          if not jpeg.endswith(b'\xff\xd9'):
              raise SystemExit('Invalid JPEG end marker')

          digest = hashlib.sha256(jpeg).hexdigest()
          expected = 'a16b04407cde2e2f11e2f023db9934d36101a09f2c5cc69726fc6e9f3d8cba94'
          if digest != expected:
              raise SystemExit(f'Unexpected SHA-256: {digest}')

          (root / 'assets/generic-prevention-hero.jpg.b64').write_text(payload, encoding='ascii')
          shutil.rmtree(upload)
          (root / '.github/workflows/install-photo3-from-parts.yml').unlink()
          PY

      - name: Commit verified photo 3 asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Install verified prevention photo 3 asset"
          git push
